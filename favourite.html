<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное Goodwill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Управление музыкой -->
        <div class="music-player-container">
    <button id="musicBtn" class="music-btn" aria-label="Включить музыку">🔈 Включить музыку</button>
    <!-- Сам элемент аудио, который скрыт. loop заставляет музыку играть по кругу -->
    <audio id="bgMusic" src="music.mp3" loop></audio>
</div>
    <!-- Шапка страницы избранного (Заголовок строго по центру, кнопка справа) -->
        <header class="header" style="background-image: url('https://media.tproger.ru/uploads/2018/12/new-year-cover.jpg');">
        <!-- Кнопка «Купить» слева на странице избранного -->
        <a href="contacts.html" class="music-btn buy-btn-left" style="text-decoration: none; display: inline-block;">🛒 Купить</a>

        <!-- Заголовок страницы -->
        <h1 class="hdr">Ваше Избранное</h1>
        
        <!-- Кнопка возврата в магазин справа -->
        <a href="shop.html" class="music-btn" style="text-decoration: none; display: inline-block; background-color: crimson; margin: 0;">🎄 В магазин</a>
    </header>

    <main>
        <section class="intro">
            <h2>Отложенные украшения</h2>
            <p>Здесь собрана ваша новогодняя сказка!</p>
        </section>

        <!-- Сетка каталога (Сюда твой новый файл favourite.js выведет ТОЛЬКО лайкнутые товары) -->
        <section class="catalog-grid"></section>
    </main>

    <footer class="footer">
        <a href="index.html">⬅ Вернуться на главную</a>
    </footer>

    <!-- ПОДКЛЮЧЕНИЕ ССЫЛОК НА ВСЕ ФАЙЛЫ (Строгий правильный порядок) -->
    <script src="product.js"></script>
    <script src="script.js"></script>
    <script src="favourite.js"></script>
    
</body>
</html>
